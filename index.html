<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamixPH - Movies & Series</title>
    
    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDKs (Realtime Database Activated) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

    <!-- 1. POPUP DIALOG / PAYWALL -->
    <div id="gatekeeperModal" class="modal-overlay">
        <div class="modal-box">
            <img src="logo.png" alt="Logo" class="dialog-logo" onerror="this.style.display='none'">
            <h2 class="dialog-title">StreamixPH VIP</h2>
            <p class="dialog-desc">Mag-sign in gamit ang Google at magbayad para ma-unlock ang access.</p>

            <div id="userInfo" class="user-status">Status: Not Logged In</div>

            <button class="paywall-btn btn-google" onclick="loginWithGoogle()">🔑 Sign In with Google</button>
            <button class="paywall-btn btn-paypal" onclick="openPayPal()">💳 Pay 50 PHP via PayPal</button>

            <!-- SUBMIT TRANSACTION ID ONLY -->
            <div class="transaction-box">
                <p class="tx-title">Submit PayPal Transaction ID:</p>
                <input type="text" id="refInput" class="paywall-input" placeholder="Enter Transaction / Reference ID">
                <button class="paywall-btn btn-submit" onclick="submitTransaction()">📤 Send Transaction ID</button>
            </div>

            <!-- ADMIN SECRET PASS -->
            <div class="secret-pass-box">
                <input type="password" id="secretPassInput" class="paywall-input" placeholder="Admin Secret Password">
                <button class="paywall-btn btn-secret" onclick="checkSecretPass()">Unlock with Password</button>
            </div>

            <button class="paywall-btn btn-dev" onclick="contactDev()">✈ Contact Telegram Dev</button>
        </div>
    </div>

    <!-- 2. HEADER -->
    <header class="site-header">
        <div class="top-bar">
            <div id="userProfileHeader" class="user-profile-header">
                <img id="userAvatar" src="https://www.gstatic.com/images/branding/product/1x/avatar_square_grey_512dp.png" alt="Profile" class="user-avatar">
                <div class="user-info-text">
                    <span id="userWelcome" class="user-welcome">Welcome!</span>
                    <span class="user-vip-badge">VIP Member</span>
                </div>
            </div>
            <img src="logo.png" alt="StreamixPH" class="site-logo" onerror="this.style.display='none'">
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Search Movie or Series..." onkeydown="if(event.key==='Enter') searchTMDB()">
            <button class="search-btn" onclick="searchTMDB()">Search</button>
        </div>
    </header>

    <!-- 3. SHOWCASE CARD -->
    <main class="showcase-area">
        <div class="movie-card">
            <span id="cardBadge" class="badge badge-tv">SERIES</span>
            <img id="cardPoster" class="poster" src="https://image.tmdb.org/t/p/w500/dum1NsAYVfyxGM14DYJgNf5i89q.jpg" alt="Poster">
            <h3 id="cardTitle">One Piece</h3>
            <p id="cardRating">&#9733; 8.8 Rating (1999)</p>

            <div id="seriesControls" class="series-controls">
                <select id="seasonSelect" onchange="loadSeasonEpisodes()"></select>
                <select id="episodeSelect"></select>
            </div>

            <button class="btn-watch" onclick="handleWatchClick()">Watch Now</button>
        </div>
    </main>

    <!-- 4. SEARCH MODAL -->
    <div id="searchModal" class="modal-overlay">
        <div class="modal-box modal-search">
            <button class="close-btn" onclick="closeSearchModal()">✕</button>
            <h3 style="margin-top:0;">Search Results</h3>
            <div id="searchResultsList"></div>
        </div>
    </div>

    <!-- 5. BUILT-IN PLAYER -->
    <div id="playerModal" class="modal-overlay">
        <div class="player-frame">
            <button class="close-btn" onclick="closePlayer()">✕ Close</button>
            <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay"></iframe>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
